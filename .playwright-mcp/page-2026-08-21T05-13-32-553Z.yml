      - generic [ref=e92]:
        - generic [ref=e93]:
          - paragraph [ref=e94]: We are acquiring and renovating a landmark home on Vernon Avenue and converting it into a dedicated Jewish community center. A visible address on a main street, open every week of the year, for the families who are here and the ones who don't yet know we are.
