        - paragraph [ref=e53]: Our Story
        - heading "What began over coffee became a community." [level=2] [ref=e54]
        - paragraph [ref=e55]: "Since 2019, what started as small Shabbat dinners and conversations over coffee has grown into a full Jewish life: services, a Hebrew school, teen leadership, women's programs, adult learning, and the celebrations that hold a community together."
        - paragraph [ref=e56]: All of it built out of a private home, and all of it now bigger than the walls that hold it. Glencoe has roughly 9,000 residents, one third of them Jewish, and we are turning families away from programs that fill within hours.
        - generic [ref=e57]:
          - img "Rabbi Sholom and Deena Wolberg" [ref=e58]
