        - paragraph [ref=e72]: The Future We're Building
        - heading "What a building makes possible." [level=2] [ref=e73]
        - paragraph [ref=e74]: "A permanent home opens the door to a new level of Jewish life in Glencoe: more opportunities to gather, learn, celebrate, connect, and grow together."
      - generic [ref=e75]:
        - article [ref=e76]:
          - heading "Children who know who they are" [level=3] [ref=e77]
          - paragraph [ref=e78]: A place where children and teens learn, create, build friendships, and step into leadership, growing up with Judaism as a joyful, natural part of daily life.
        - article [ref=e79]:
          - heading "A community that comes together" [level=3] [ref=e80]
          - paragraph [ref=e81]: Shabbat and holiday celebrations, shared meals, and the milestones a community marks together, in a place where everyone is welcome and no one arrives a stranger.
        - article [ref=e82]:
          - heading "Jewish life that keeps growing" [level=3] [ref=e83]
          - paragraph [ref=e84]: Adult learning, the Jewish Women's Circle, Mentch Club, and classes that meet people at every stage of life, from first curiosity to lifelong study.
